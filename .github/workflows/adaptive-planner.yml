name: Adaptive Planner
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  planner:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, core tests and data-free demo
        shell: pwsh
        run: ./adaptive-planner/scripts/demo-all.ps1 -Build -Synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-validation
          path: |
            adaptive-planner/planner-app/target/surefire-reports/
            adaptive-planner/.runs/synthetic-*.txt
            adaptive-planner/.runs/synthetic-*.json
